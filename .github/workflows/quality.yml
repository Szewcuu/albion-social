name: Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-anon-key' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Validate item catalog snapshot
        run: npm run catalog:validate
      - name: Production build
        run: npm run build
      - name: JavaScript performance budget
        run: npm run performance:budget
      - name: Public E2E
        run: npm run test:e2e:public
        env:
          E2E_SKIP_BUILD: '1'
      - name: Authenticated E2E
        if: ${{ env.E2E_USER_EMAIL != '' && env.E2E_USER_PASSWORD != '' }}
        run: npm run test:e2e:auth
        env:
          E2E_SKIP_BUILD: '1'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Upload performance budget report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-budget
          path: .next/performance-budget-report.json
          retention-days: 14
