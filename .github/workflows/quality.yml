name: Quality

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL wdrożenia do audytu Lighthouse
        required: false
        default: https://albion-social.vercel.app
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-anon-key' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Validate Supabase migration history
        run: npm run migrations:validate
      - name: Validate item catalog snapshot
        run: npm run catalog:validate
      - name: Production build
        run: npm run build
      - name: JavaScript performance budget
        run: npm run performance:budget
      - name: Public E2E
        run: npm run test:e2e:public
        env:
          E2E_SKIP_BUILD: '1'
      - name: Authenticated E2E
        if: ${{ env.E2E_USER_EMAIL != '' }}
        run: npm run test:e2e:auth
        env:
          E2E_SKIP_BUILD: '1'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Upload performance budget report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-budget
          path: .next/performance-budget-report.json
          retention-days: 14

  lighthouse:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIGHTHOUSE_GUEST_ONLY: ${{ secrets.E2E_USER_EMAIL == '' && '1' || '0' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      LIGHTHOUSE_BASE_URL: ${{ inputs.base_url || 'https://albion-social.vercel.app' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.21.1
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install isolated Lighthouse tooling
        run: npm install --no-save --package-lock=false --ignore-scripts lighthouse@13.4.1 puppeteer-core@25.7.0
      - name: Run guest and authenticated Lighthouse audit
        run: node scripts/run-lighthouse-audits.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-results
          path: lighthouse-results
          retention-days: 14
