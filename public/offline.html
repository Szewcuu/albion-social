<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#120d09" />
    <title>Albion Polska — brak połączenia</title>
    <style>
      :root { color-scheme: dark; font-family: Georgia, "Times New Roman", serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #e4d7bd; background: radial-gradient(circle at top, #342316 0, #120d09 52%, #080506 100%); }
      main { width: min(520px, 100%); padding: 38px 28px; text-align: center; border: 1px solid rgba(240, 207, 114, .35); border-radius: 12px; background: rgba(24, 16, 11, .92); box-shadow: 0 28px 80px rgba(0, 0, 0, .45); }
      img { width: 72px; height: 72px; object-fit: contain; }
      p:first-of-type { margin: 18px 0 6px; color: #f0cf72; font: 800 11px/1.3 system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 0; color: #fff6df; font-size: clamp(28px, 7vw, 42px); line-height: 1.08; }
      p { color: #b9aa90; line-height: 1.65; }
      button { margin-top: 12px; padding: 12px 20px; color: #181008; background: #d3aa45; border: 1px solid #f0cf72; border-radius: 5px; font: 800 12px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-256.webp" alt="" width="72" height="72" />
      <p>Brama portalu jest chwilowo zamknięta</p>
      <h1>Brak połączenia z siecią</h1>
      <p>Prywatne strony i dane konta nie są przechowywane offline. Po odzyskaniu połączenia wrócisz bezpiecznie do portalu.</p>
      <button type="button" onclick="window.location.reload()">Spróbuj ponownie</button>
    </main>
  </body>
</html>
